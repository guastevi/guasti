<!DOCTYPE html>
<html lang="ca">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{
  --paper:#ffffff; --card:#ffffff; --ink:#111111; --mute:#6e6e73; --line:#e2e2e2;
  --accent:#111111; --on-accent:#ffffff; --blue:#2AABEE; --blue-ink:#1683c9;
  --accent-soft:#e8f5fd; --chip:#f2f2f2;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#000000; --card:#121212; --ink:#f5f5f5; --mute:#9a9a9a; --line:#2c2c2c;
         --accent:#f5f5f5; --on-accent:#000000; --blue:#2AABEE; --blue-ink:#5cc0f2;
         --accent-soft:#0c2a3b; --chip:#1e1e1e; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
header{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 16px 0;border-bottom:1px solid var(--line)}
h1{font-size:22px;font-weight:700;line-height:1.2;margin:0 0 10px;letter-spacing:-.2px;display:flex;align-items:center}
.rl{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:5px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.rl.busy svg{animation:ringspin .8s linear infinite}
@media (max-width:420px){.rl span{display:none}.rl{padding:6px}}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--mute);padding:8px 10px 10px;font:inherit;font-weight:500;
  border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--blue)}
main{padding:12px 16px 110px;max-width:760px;margin:0 auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools input[type=search]{flex:1 1 100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font:inherit}
.tools select{flex:1 1 30%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.count{color:var(--mute);font-size:13px;margin:4px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.card .t{font-weight:600}
.card .s{color:var(--mute);font-size:13px;margin-top:2px}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px;margin:6px 4px 0 0;color:var(--ink)}
.tag.a{background:var(--accent-soft);color:var(--blue-ink)}
.group{font-size:15px;font-weight:700;margin:18px 2px 8px;color:var(--ink)}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
  border:0;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:56px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
#panel{position:fixed;inset:0;background:var(--paper);z-index:10;overflow-y:auto;display:none}
#panel.open{display:block}
.ph{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{flex:1;font-size:18px;font-weight:700;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{padding:14px 16px 60px;max-width:760px;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.d{color:#b3261e}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
dl{margin:0}
dt{color:var(--mute);font-size:12px;margin-top:10px}
dd{margin:0;word-break:break-word}
label{display:block;color:var(--mute);font-size:13px;margin:12px 0 4px}
.f input,.f select,.f textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font:inherit}
.f textarea{min-height:80px}
.f .chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink)}
.f .chk input{width:auto}
h3{font-size:15px;font-weight:700;margin:22px 0 8px}
.doc{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px}
.doc a{color:var(--ink);text-decoration:none;flex:1;font-weight:500}
.doc .fmt{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
a{color:var(--blue-ink)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:8px 14px;border-radius:8px;font-size:14px;display:none;z-index:20;max-width:90%}
.loading{color:var(--mute);text-align:center;padding:60px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gi{cursor:pointer}
.gi .t{font-size:13px;font-weight:600;margin-top:6px;line-height:1.3;text-align:center;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gi .s{font-size:12px;color:var(--mute);text-align:center}
.pv{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:12px;overflow:hidden;cursor:pointer;min-height:120px}
@media (max-width:520px){ .grid{grid-template-columns:repeat(3,1fr);gap:10px} .gi .t{font-size:12px} }
.cover{position:relative;aspect-ratio:3/4;background:var(--chip);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:#fff}
.cover .cph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:8px;font-size:12px;font-weight:600;line-height:1.25;color:var(--mute);word-break:break-word;overflow:hidden}
.cover img:not([src]){display:none}
.cover .cfmt{position:absolute;right:6px;bottom:6px;font-size:10px;background:var(--card);border-radius:4px;padding:1px 5px;color:var(--mute)}
.card.wt{display:flex;gap:12px;align-items:flex-start}
.card.wt .cover{flex:0 0 54px;aspect-ratio:3/4}
.card.wt .cover .cph{font-size:9px;padding:3px}
.card.wt .body{flex:1;min-width:0}
.doc .cover{flex:0 0 40px}
.doc .cover .cph{font-size:8px;padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;
  font:inherit;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.add{border-style:dashed;color:var(--mute)}
.addbox{display:flex;gap:6px;flex:1 1 100%}
.addbox input{flex:1;padding:8px 12px!important;border-radius:999px!important}
.hint{font-size:12px;color:var(--mute);margin:-2px 0 6px}
.sect{margin-top:26px;padding-top:6px;border-top:1px solid var(--line)}
.filebox{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mute);margin-top:10px}
.filebox input{width:100%;margin-top:8px}
.fld[hidden]{display:none}
.catbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.catbar::-webkit-scrollbar{display:none}
.catbar .chip{white-space:nowrap;flex:0 0 auto}
.cursos{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cursos > .chip{align-self:flex-start}
.cgrp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cgl{font-size:12px;color:var(--mute);width:76px;flex:0 0 76px}
.cgrp .chip{padding:6px 9px;font-size:13px;min-width:36px}
.gc{font-weight:400;color:var(--mute);font-size:13px}
.catbar.sub .chip{font-size:13px;padding:6px 12px}
.share{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.share h3{margin:0 0 8px}
.srow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.srow a.btn{text-decoration:none;color:var(--ink)}
.rv .btn{padding:6px 12px}
.edprev{margin-bottom:6px}
.edprev summary{color:var(--mute);font-size:13px;cursor:pointer}
.edprev .viewer{height:30vh;max-height:260px;margin-top:8px}
.edprev .pv{position:relative;max-height:230px;min-height:0;margin-top:8px}
.edprev .pv.wide{max-height:440px;overflow:auto}
.edprev .pv canvas + .hint{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);color:#555;font-size:12px;padding:4px 10px!important}
@media (min-width:700px){.edprev .pv{max-height:300px}}
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding-bottom:120px}
.pg{position:relative;border:2px solid transparent;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pg.on{border-color:var(--blue)}
.pg .pc{aspect-ratio:3/4;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pg canvas{max-width:100%;max-height:100%;transition:transform .15s}
.pg .pn{font-size:12px;color:var(--mute);text-align:center;margin-top:3px}
.pg.new .pn{color:var(--blue-ink)}
.pgbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:12}
.pgbar .btn{padding:8px 11px}
.pgbar .btn:disabled{opacity:.4}
.pgbar .sel{font-size:13px;color:var(--mute);flex:1 1 100%}
.pick{max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.pick div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;padding:7px 4px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button span{color:var(--mute);font-size:12px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.dropz{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mute);font-size:14px;margin-bottom:8px}
.dropz.on{border-color:var(--blue);background:var(--chip)}
.dropz .btn{margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--card)}
.tile b{display:block;font-size:22px;line-height:1.1}
.tile span{font-size:13px;color:var(--mute)}
.tile[data-go="pend"] b{color:var(--blue-ink)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:120px;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .gi .t{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.count{display:flex;align-items:center;gap:8px}
.vt{margin-left:auto;display:inline-flex;background:var(--chip);border-radius:8px;padding:2px}
.vt button{border:0;background:none;font:inherit;font-size:12px;color:var(--mute);padding:4px 10px;border-radius:6px;cursor:pointer}
.vt button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.lst{border-top:1px solid var(--line)}
.lrow{display:flex;gap:10px;align-items:center;padding:6px 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;background:none;cursor:pointer}
.lrow .cover{flex:0 0 34px;aspect-ratio:3/4}
.lrow .cover .cph{font-size:7px;padding:1px}
.lrow .cfmt{display:none}
.lrow .body{flex:1;min-width:0}
.lrow .t{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .s{font-size:12px;color:var(--mute);margin-top:1px}
.mh{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin:12px 2px 6px}
.cc{border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 12px;margin-bottom:6px;background:var(--card);display:flex;gap:12px;align-items:center}
.cch{cursor:pointer;flex:1 1 0;min-width:0}
.ccoff{flex:0 0 auto;padding:3px 8px;font-size:11px;align-self:flex-start}
.ccd{font-size:12px;font-weight:600;color:var(--blue-ink)}
.cc .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .s{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccstrip{display:flex;gap:6px;overflow-x:auto;flex:0 0 auto;max-width:55%;scrollbar-width:none;padding:1px}
.ccstrip::-webkit-scrollbar{display:none}
.ccstrip .gi{flex:0 0 44px;cursor:pointer}
.ccstrip .cover{border-radius:4px}
.ccstrip .cph{font-size:6px;padding:2px}
.ccstrip .cfmt{display:none}
.ccnone{font-size:12px;color:var(--mute);flex:0 1 auto;max-width:45%}
@media (max-width:600px){.cc{flex-wrap:wrap;row-gap:6px}.ccstrip{order:3;flex-basis:100%;max-width:100%}.ccnone{order:3;flex-basis:100%;max-width:100%}}
#stand{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none}
#stwrap{position:relative;line-height:0}
#stand #stc{background:#fff;display:block}
#stand #sto{position:absolute;left:0;top:0;pointer-events:none}
#stand.drawing #sto{pointer-events:auto;touch-action:none;cursor:crosshair}
#stand.drawing{align-items:flex-start;padding-top:56px}
#stand .sttools{position:absolute;left:0;right:0;bottom:0;display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(0,0,0,.85)}
#stand.drawing .sttools{display:flex}
#stand .sttools .btn{padding:6px 10px;font-size:13px}
#stand .sttools .btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
#stand .sw{width:28px;height:28px;border-radius:50%;border:2px solid #555;cursor:pointer}
#stand .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
#stand .stbar .btn{padding:6px 10px;font-size:13px}
#stand .stmsg{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;text-align:center;color:#aaa;font-size:14px}
.ring{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px}
.ring svg{width:76px;height:76px;animation:ringspin 1.2s linear infinite}
.ring circle{fill:none;stroke-width:5.5}
.ring .trk{stroke:rgba(255,255,255,.14)}
.ring .arc{stroke:#e53935;stroke-linecap:round;transition:stroke-dashoffset .25s ease}
.ring .lbl{color:#aaa;font-size:14px;max-width:85%;text-align:center;overflow:hidden;text-overflow:ellipsis}
.pv .ring .trk{stroke:rgba(0,0,0,.08)}
.pv .ring .lbl{color:#777;font-size:13px}
@keyframes ringspin{to{transform:rotate(360deg)}}
#stand .stbar{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px);padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(0,0,0,.78);color:#fff;transform:translateY(-110%);transition:transform .2s}
#stand.bar .stbar{transform:none}
#stand .stbar select{flex:1;min-width:0;padding:7px;border-radius:8px;border:0;font:inherit;font-size:14px}
#stand .stbar span{font-size:13px;white-space:nowrap}
.viewer{width:100%;height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:12px}
</style>
</head>

function pumpThumbs(){

/* Rodeta de càrrega vermella: un cercle que es va omplint mentre es carrega */
function ringLoader(el, label){
  var C = 2 * Math.PI * 26, p = 0, alive = true;
  el.innerHTML = '<div class="ring"><svg viewBox="0 0 64 64"><circle class="trk" cx="32" cy="32" r="26"/>' +
    '<circle class="arc" cx="32" cy="32" r="26" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" transform="rotate(-90 32 32)"/></svg>' +
    (label ? '<div class="lbl">'+esc(label)+'</div>' : '') + '</div>';
  var arc = el.querySelector('.arc');
  function set(v){ if (arc) arc.setAttribute('stroke-dashoffset', (C * (1 - v)).toFixed(1)); }
  var t = setInterval(function(){ if (!alive || !document.body.contains(arc)) { clearInterval(t); return; } p += (0.92 - p) * 0.045; set(p); }, 120);
  set(0.04);
  return {
    done: function(){ alive = false; clearInterval(t); set(1); },
    fail: function(msg){ alive = false; clearInterval(t); el.innerHTML = '<div class="ring"><div class="lbl">'+esc(msg)+'</div></div>'; }
  };
}

function card(t, s, tags, onclick){
  return '<div class="card" data-k="'+esc(onclick)+'"><div class="t">'+esc(t||'(sense títol)')+'</div>' +
    (s?'<div class="s">'+esc(s)+'</div>':'') + (tags||'') + '</div>';
}
function tag(t, a){ return t ? '<span class="tag'+(a?' a':'')+'">'+esc(t)+'</span>' : ''; }

function obraCard(o){
  var nd = docsFor('Obra', o['ID']).length;
  var sub = [o['Instrument'], o['Paper'], o['Agrupació'], o['Any aproximat']].filter(Boolean).join(' · ');
  var tags = tag(o['Formació'] || o['Categoria'], true) + tag(o['Àmbit']) + splitTags(o['Curs']).map(function(c){ return tag(c); }).join('') + tag(o['Fagotada'] ? 'Fagotada '+o['Fagotada'] : '') +
    splitTags(o['Etiquetes']).map(function(t){ return tag(t); }).join('') +
    (o['Fragment orquestral']?tag('Fragment orquestral'):'') + (nd?tag(nd+(nd>1?' documents':' document')):'');
  var title = [o['Obra'],o['Compositor']].filter(Boolean).join(' - ');
  var fd = firstDoc('Obra', o['ID']);
  if (!fd) return card(title, sub, tags, 'Obres|'+o['ID']);
  return '<div class="card wt" data-k="Obres|'+esc(o['ID'])+'">'+cover(fd, o['Obra'])+'<div class="body"><div class="t">'+esc(title)+'</div>' +
    (sub?'<div class="s">'+esc(sub)+'</div>':'') + tags + '</div></div>';
}

function renderList(){

    items = rows('Obres').filter(function(o){ return matches(o, refLabel('Concerts', o['Concert'])); })
      .sort(function(a,b){ return norm(a['Obra']).localeCompare(norm(b['Obra'])) || norm(a['Compositor']).localeCompare(norm(b['Compositor'])); });
    h = '<div class="count">'+items.length+' obres</div>' + items.map(obraCard).join('');
  }

    var cg = centreGroups(), cursos = cg.concat((D.Llistes['Curs']||[]).filter(function(c){ return !isGroup(c); }));
    items = rows('Obres').filter(function(o){ return (o['Curs'] || o['Àmbit']==='Pedagògic' || cg.some(function(g){ return inGroup(o, g); })) && inCentre(o) && matches(o); })
      .sort(function(a,b){ return norm(a['Obra']).localeCompare(norm(b['Obra'])); });
    var list2 = S.curs ? [S.curs] : cursos.concat(['Sense curs']);
    list2.forEach(function(c){
      var g = items.filter(function(o){ return c==='Sense curs' ? !splitTags(o['Curs']).length && !cg.some(function(x){ return inGroup(o, x); }) : inGroup(o, c); });
      if (g.length) h += '<div class="group">'+esc(c)+' <span class="gc">'+g.length+'</span></div>' + g.map(obraCard).join('');
    });
    if (S.curs) { var cdn = pdfOnly(courseDocs(S.curs)).length;
      if (cdn) h = '<div class="row" style="margin-top:0"><button class="btn p" id="cpkg">Paquet de '+esc(S.curs)+' (PDF \u00fanic)</button><button class="btn" id="cstand">Mode faristol</button><span class="hint" style="align-self:center">'+cdn+' PDF</span></div>' + h; }
    if (!h) h = '<div class="empty">'+(S.curs ? 'Encara no hi ha obres per a '+esc(S.curs)+'.' : 'Encara no hi ha repertori pedagògic.')+
      '<br>Prem + per afegir-ne.</div>';
  }
  else if (S.tab==='Documents') {
    items = rows('Documents').filter(function(d){ return (S.kind==='tot' || docKind(d)===S.kind) && matches(d, refLabel('Obres', d['Obra'])+' '+refLabel('Concerts', d['Concert'])); })
      .sort(function(a,b){ return norm(a['Títol']).localeCompare(norm(b['Títol'])); });
    var ents = [], bk = {};

      bk[b].docs.push(d);

      return head + card(n, sub, '', 'Compositor|'+n);

  }
  else {

/* ---------- Compositors ---------- */
// Agrupa per nom sense distingir maj\u00fascules ni accents (Dvorak = Dvo\u0159\u00e1k), i es queda amb la grafia m\u00e9s freq\u00fcent
function composerMap(){
  var byKey = {};
  function add(n, f){ n = String(n||'').trim(); if (!n) return; var k = norm(n);
    var e = byKey[k] = byKey[k] || { names: {}, o: 0, d: 0 }; e.names[n] = (e.names[n]||0) + 1; e[f]++; }
  rows('Obres').forEach(function(o){ add(o['Compositor'], 'o'); });
  rows('Documents').forEach(function(d){ add(d['Compositor'], 'd'); });
  var out = {};
  Object.keys(byKey).forEach(function(k){ var e = byKey[k];
    var best = Object.keys(e.names).sort(function(a,b){ return e.names[b] - e.names[a]; })[0]; out[best] = { o: e.o, d: e.d, key: k }; });
  return out;
}
function showComposer(name){
  var k = norm(name);
  var obres = rows('Obres').filter(function(o){ return norm(o['Compositor']) === k; }).sort(function(a,b){ return norm(a['Obra']).localeCompare(norm(b['Obra'])); });
  var docs = rows('Documents').filter(function(d){ return norm(d['Compositor']) === k; }).sort(function(a,b){ return norm(a['T\u00edtol']).localeCompare(norm(b['T\u00edtol'])); });
  var back = function(){ showComposer(name); };
  openPanel(name, (pdfOnly(docs).length ? '<div class="row" style="margin-top:0"><button class="btn p" id="cmstand">Mode faristol</button><button class="btn" id="cmpkg">PDF \u00fanic</button></div>' : '') +
    (obres.length ? '<h3>Obres <span class="gc">'+obres.length+'</span></h3>' + obres.map(obraCard).join('') : '') +

function bookCover(docs){
  return docs.filter(function(d){ return /full score|partitura general|general|score/i.test(d['T\u00edtol']); })[0] ||
    docs.slice().sort(function(a,b){ return norm(a['T\u00edtol']).localeCompare(norm(b['T\u00edtol'])); })[0];
}
function showBook(name){
  var docs = rows('Documents').filter(function(d){ return d['Llibre']===name; })
    .sort(function(a,b){ return norm(a['T\u00edtol']).localeCompare(norm(b['T\u00edtol'])); });
  var back = function(){ showBook(name); };
  var short = function(d){ var tt = String(d['T\u00edtol']||''), sx = ' - ' + name;
    return tt.toLowerCase().slice(-sx.length) === sx.toLowerCase() ? tt.slice(0, -sx.length) : tt; };
  var body = S.view==='list' ? '<div class="lst">' + docs.map(function(d){ return docRow(d, short(d), [d['Tipus'], d['Format']].filter(Boolean).join(' \u00b7 '), 'Documents|'+d['ID']).replace('class="lrow card"', 'class="lrow" data-open="'+esc(d['ID'])+'"'); }).join('') + '</div>' :
    '<div class="grid">' + docs.map(function(d){
      var tt = String(d['T\u00edtol']||''), sx = ' - ' + name;
      if (tt.toLowerCase().slice(-sx.length) === sx.toLowerCase()) tt = tt.slice(0, -sx.length);
      return '<div class="gi" data-open="'+esc(d['ID'])+'">' + cover(d, tt) + '<div class="t">'+esc(tt)+'</div><div class="s">'+esc(d['Tipus']||'')+'</div></div>';
    }).join('') + '</div>' +
    '';
  openPanel(name, '<div class="count">'+docs.length+' fitxers en aquest llibre<span class="vt"><button class="'+(S.view!=='list'?'on':'')+'" data-view="grid">Portades</button><button class="'+(S.view==='list'?'on':'')+'" data-view="list">Llista</button></span></div>' + body +
    '<div class="row" style="margin-top:20px"><button class="btn p" id="bstand">Mode faristol</button><button class="btn" id="bpkg">PDF \u00fanic (gui\u00f3 + particel\u00b7les)</button><button class="btn" id="bmove">Ajunta-ho en una carpeta del Drive</button><button class="btn" id="bren">Canvia el nom</button><button class="btn d" id="bdel">Desfes el llibre</button></div>');
  Array.prototype.forEach.call($('panel').querySelectorAll('[data-open]'), function(g){
    g.onclick = function(){ showDetail('Documents', g.dataset.open, back); };
  });
  Array.prototype.forEach.call($('panel').querySelectorAll('[data-view]'), function(b){
    b.onclick = function(){ setView(b.dataset.view); showBook(name); };
  });
  var ids = docs.map(function(d){ return d['ID']; });
  $('bstand').onclick = function(){ showStand(docs, name); };
  $('bpkg').onclick = function(){ showPackage(docs.slice(), name, back, { score: true }); };
  $('bmove').onclick = function(){
    var bb = $('bmove'); bb.disabled = true; bb.textContent = 'Movent ' + docs.length + ' fitxers...';
    run('moveBook', name).then(function(m){ return load().then(function(){ toast(m); showBook(name); }); })
      .catch(function(e){ bb.disabled = false; bb.textContent = 'Ajunta-ho en una carpeta del Drive'; toast('Error: ' + e.message); });
  };
  $('bren').onclick = function(){
    var nn = prompt('Nom del llibre:', name); if (!nn || nn===name) return;
    run('setLlibre', ids, '', nn.trim()).then(load).then(function(){ toast('Nom canviat'); showBook(nn.trim()); }).catch(function(e){ toast('Error: '+e.message); });
  };
  $('bdel').onclick = function(){
    if (!confirm('Tornar a mostrar aquests fitxers per separat? No s\'esborra res.')) return;
    run('setLlibre', ids, '', '').then(load).then(function(){ toast('Llibre desfet'); closePanel(); }).catch(function(e){ toast('Error: '+e.message); });
  };
}

function chipOptions(src){
  var t = src.slice(0,1), n = src.slice(2);
  if (t==='F') return n ? (D.Llistes['Formació: '+n]||[]).slice() : [];
  if (t==='L') return (D.Llistes[n]||[]).slice();
  var vals = rows(n).map(function(r){ return String(r[KEYS[n]]); }).filter(Boolean);
  if (n==='Fagotades') vals.sort().reverse();
  else if (n!=='Agrupacions') vals.sort(function(a,b){ return norm(a).localeCompare(norm(b)); });
  return vals.filter(function(x){ return x!=='Desconeguda'; });
}
function splitTags(v){ return String(v||'').split(/\s*,\s*/).filter(Boolean); }
function chipsHtml(k, src, v, multi){
  var opts = chipOptions(src);
  if (multi) {
    var sel = splitTags(v);
    sel.forEach(function(x){ if (opts.indexOf(x)===-1) opts.push(x); });
    return '<div class="chips" data-k="'+esc(k)+'" data-multi="1" data-val="'+esc(sel.join(', '))+'" data-src="'+esc(src)+'">' +
      opts.map(function(o){ return '<button type="button" class="chip'+(sel.indexOf(o)!==-1?' on':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</button>'; }).join('') +
      '<button type="button" class="chip add">+ Afegeix</button></div>';
  }
  if (src==='F:' && !v) return '<div class="chips" data-k="'+esc(k)+'" data-val="" data-src="F:"><span class="hint">Tria primer la categoria.</span></div>';
  if (v && opts.indexOf(v)===-1) opts.push(v);
  return '<div class="chips" data-k="'+esc(k)+'" data-val="'+esc(v||'')+'" data-src="'+esc(src)+'">' +
    opts.map(function(o){ return '<button type="button" class="chip'+(o===v?' on':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</button>'; }).join('') +
    '<button type="button" class="chip add">+ Afegeix</button></div>';
}
function inputFor(f, v, r){
  var k=f[0], t=f[1], id='f_'+k.replace(/\W/g,'_');

  if (t==='multi') {
    return '<label>'+esc(lbl(k))+'</label>' + (HINTS[k]?'<div class="hint">'+esc(HINTS[k])+'</div>':'') + chipsHtml(k, f[2], v, true);
  }
  if (t==='chips') {
    var src = f[2]==='F:' ? 'F:'+((r&&r['Categoria'])||'') : f[2];
    return '<label>'+esc(lbl(k))+'</label>' + (HINTS[k]?'<div class="hint">'+esc(HINTS[k])+'</div>':'') + chipsHtml(k, src, v);
  }
  if (t==='files') {
    return '<div class="sect"><h3>Partitures i fitxers</h3>' +
      '<label>'+esc(lbl('__tipus'))+'</label>' + chipsHtml('__tipus', 'L:Tipus document', f[2], true) +
      '<div class="dropz" id="fdrop">Arrossega aqu\u00ed els PDF, MusicXML, MuseScore, Notion o \u00e0udios, o<br><button class="btn" id="faddf" type="button">Afegeix fitxers</button>' +
      '<div class="hint" style="margin-top:6px">Pots tornar a tocar \u00abAfegeix fitxers\u00bb per afegir-ne d\'altres carpetes.</div>' +
      '<input type="file" id="ffiles" multiple style="display:none" ' +
      'accept=".pdf,.xml,.musicxml,.mxl,.mscz,.mscx,.notion,.musx,.mus,.sib,.dorico,.mid,.midi,.ly,.gp,.gpx,audio/*,image/*,application/pdf"></div><div class="lst" id="fflist"></div><div id="fprog" class="hint" style="margin-top:8px"></div></div>';
  }
  if (t==='list') {
    opts = (D.Llistes[f[2]]||[]);
    return '<label>'+esc(lbl(k))+'</label><select data-k="'+esc(k)+'"><option value=""></option>' +
      opts.map(function(o){ return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'; }).join('') + '</select>';
  }
  if (t==='ref') {
    var rs = rows(f[2]).slice();
    if (f[2]==='Concerts') rs.sort(function(a,b){ return String(b['Data']).localeCompare(String(a['Data'])); });
    return '<label>'+esc(lbl(k))+'</label><select data-k="'+esc(k)+'"><option value=""></option>' +
      rs.map(function(r){ var key=r[KEYS[f[2]]]; return '<option value="'+esc(key)+'"'+(String(key)===String(v)?' selected':'')+'>'+esc(refLabel(f[2], key))+'</option>'; }).join('') + '</select>';
  }
  if (t==='name') {
    return '<label>'+esc(lbl(k))+'</label><input data-k="'+esc(k)+'" list="'+id+'" value="'+esc(v)+'" autocomplete="off"><datalist id="'+id+'">' +
      rows(f[2]).map(function(r){ return '<option value="'+esc(r[KEYS[f[2]]])+'">'; }).join('') + '</datalist>';
  }
  if (t==='comp') {
    var comps = uniq(rows('Obres').map(function(o){ return o['Compositor']; }).concat(rows('Documents').map(function(d){ return d['Compositor']; })));
    return '<label>'+esc(lbl(k))+' <b style="color:var(--blue-ink)">*</b></label><div class="hint">'+esc(HINTS[k])+'</div><input data-k="'+esc(k)+'" list="'+id+'" value="'+esc(v)+'" autocomplete="off" placeholder="Ex.: Mozart, Weissenborn, Popular...">' +
      '<datalist id="'+id+'">' + comps.map(function(c){ return '<option value="'+esc(c)+'">'; }).join('') + '</datalist>';
  }
  if (t==='book') {
    return '<label>'+esc(lbl(k))+'</label><div class="hint">'+esc(HINTS[k])+'</div><input data-k="'+esc(k)+'" list="'+id+'" value="'+esc(v)+'" autocomplete="off" placeholder="Sense llibre"><datalist id="'+id+'">' +
      uniq(rows('Documents').map(function(d){ return d['Llibre']; })).map(function(b){ return '<option value="'+esc(b)+'">'; }).join('') + '</datalist>';
  }

  var type = {number:'number', date:'date', time:'time', url:'url'}[t] || 'text';
  return '<label>'+esc(lbl(k))+'</label><input type="'+type+'" data-k="'+esc(k)+'" value="'+esc(v)+'"'+(t==='number'?' inputmode="decimal"':'')+'>';
}

function chipsVal(root, k){
  var el = root.querySelector('.chips[data-k="'+k+'"]'); return el ? (el.dataset.val||'') : null;
}
function updateVis(root){
  Array.prototype.forEach.call(root.querySelectorAll('.fld[data-showif]'), function(fd){
    var ok = fd.dataset.showif.split(';').some(function(rule){
      var m = /^(.+?)([=~])(.*)$/.exec(rule); if (!m) return false;
      var cur = chipsVal(root, m[1]) || '', allowed = m[3].split('|');
      if (m[2]==='~') { var tags = splitTags(cur); return allowed.some(function(a){ return tags.indexOf(a)!==-1; }); }
      return allowed.indexOf(cur)!==-1;
    });
    var own = fd.querySelector('[data-k]'); var ownVal = own ? (own.dataset.val || own.value || '') : '';
    fd.hidden = !(ok || ownVal);
  });
  // Formaci\u00f3: s'amaga si la categoria no t\u00e9 subdivisions (p. ex. Orquestra)
  var fb = root.querySelector('.chips[data-k="Formaci\u00f3"]');
  if (fb) { var fd2 = fb.closest('.fld'); var cat = chipsVal(root, 'Categoria');
    fd2.hidden = !!cat && !fb.querySelector('.chip[data-v]') && !fb.dataset.val; }
}
function toggleChip(box, v){
  if (!box.dataset.multi) { selectChip(box, box.dataset.val===v ? '' : v); return; }
  var sel = splitTags(box.dataset.val), i = sel.indexOf(v);
  if (i===-1) sel.push(v); else sel.splice(i,1);
  box.dataset.val = sel.join(', ');
  Array.prototype.forEach.call(box.querySelectorAll('.chip[data-v]'), function(c){ c.classList.toggle('on', sel.indexOf(c.dataset.v)!==-1); });
}
function selectChip(box, v){
  if (box.dataset.multi) { var sel = splitTags(box.dataset.val); if (sel.indexOf(v)===-1) toggleChip(box, v); return; }
  box.dataset.val = v;
  Array.prototype.forEach.call(box.querySelectorAll('.chip[data-v]'), function(c){ c.classList.toggle('on', c.dataset.v===v); });
}
function bindBox(box, root){
  box.addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if (!c) return;
    e.preventDefault();
    if (c.classList.contains('add')) {
      var ab = document.createElement('div'); ab.className='addbox';
      ab.innerHTML = '<input placeholder="Nou valor..."><button type="button" class="chip on">Afegeix</button>';
      c.replaceWith(ab);
      var inp = ab.querySelector('input'); inp.focus();
      var done = function(){
        var v = inp.value.trim();
        var addBtn = document.createElement('button'); addBtn.type='button'; addBtn.className='chip add'; addBtn.textContent='+ Afegeix';
        if (v) {
          var ex = Array.prototype.filter.call(box.querySelectorAll('.chip[data-v]'), function(x){ return x.dataset.v===v; })[0];
          if (!ex) { ex = document.createElement('button'); ex.type='button'; ex.className='chip'; ex.dataset.v=v; ex.textContent=v; box.insertBefore(ex, ab); }
          selectChip(box, v); chipChanged(box, root);
        }
        ab.replaceWith(addBtn); updateVis(root);
      };
      ab.querySelector('button').onclick = done;
      inp.onkeydown = function(ev){ if (ev.key==='Enter'){ ev.preventDefault(); done(); } };
      return;
    }
    if (!c.dataset.v) return;
    toggleChip(box, c.dataset.v);
    chipChanged(box, root);
    updateVis(root);
  });
}
function chipChanged(box, root){
  if (box.dataset.k !== 'Categoria') return;
  var fb = root.querySelector('.chips[data-k="Formaci\u00f3"]'); if (!fb) return;
  var cat = box.dataset.val || '';
  var tmp = document.createElement('div');
  tmp.innerHTML = cat ? chipsHtml('Formaci\u00f3', 'F:'+cat, '') : chipsHtml('Formaci\u00f3', 'F:', '');
  var nb = tmp.firstChild; fb.replaceWith(nb); bindBox(nb, root); updateVis(root);
}
function bindChips(root){
  Array.prototype.forEach.call(root.querySelectorAll('.chips'), function(box){ bindBox(box, root); });
  updateVis(root);
}
function uploadFiles(files, meta, progEl){
  var i = 0;
  function next(){
    if (i >= files.length) return Promise.resolve();
    var file = files[i++];
    if (progEl) progEl.textContent = 'Pujant '+i+' de '+files.length+': '+file.name;
    return new Promise(function(res, rej){
      var rd = new FileReader();
      rd.onload = function(){ res(rd.result.split(',')[1]); };
      rd.onerror = rej; rd.readAsDataURL(file);
    }).then(function(b64){
      var mm = {}; for (var k in meta) mm[k]=meta[k];
      return run('uploadFile', { name:file.name, mimeType:file.type, data:b64, meta:mm });
    }).then(next);
  }
  return next();
}

// Revisi\u00f3 sistem\u00e0tica: va obrint un per un els documents que encara no has revisat (agrupats per carpeta)
function reviewNext(){
  S.revSkip = S.revSkip || {};
  var q = rows('Documents').filter(function(d){ return !d['Revisat'] && !S.revSkip[d['ID']]; });
  var key = function(d){ return norm(((d['Notes']||'').match(/Carpeta: ([^\u00b7]*)/) || [,''])[1] + ' ' + (d['Llibre']||'') + ' ' + d['T\u00edtol']); };
  q.sort(function(a,b){ return key(a).localeCompare(key(b)); });
  if (!q.length) { closePanel(); toast('No queda res per revisar'); render(); return; }
  showForm('Documents', q[0], function(){ closePanel(); render(); }, { review: q.length });
}
function showForm(name, r, back, opts){
  r = r || {}; opts = opts || {};
  var isNew = !r[KEYS[name]] || (name==='Obres' && !r['ID']) || (name==='Documents' && !r['ID']);
  if (name==='Agrupacions' || name==='Directors' || name==='Fagotades') isNew = !find(name, r[KEYS[name]]);
  var body = '<div class="f">' + SCHEMA[name].map(function(f){ return '<div class="fld"'+(f[3]?' data-showif="'+esc(f[3])+'"':'')+'>'+inputFor(f, r[f[0]]||'', r)+'</div>'; }).join('') + '</div>' +
    (opts.review ? '<div class="row"><button class="btn p" id="sv">Desa i seg\u00fcent</button><button class="btn" id="rvskip">Salta</button>' + (!isNew?'<button class="btn d" id="del">Elimina</button>':'') + '</div>'
      : '<div class="row"><button class="btn p" id="sv">Desa</button>' + (!isNew?'<button class="btn d" id="del">Elimina</button>':'') + '</div>');
  var fem = (name==='Obres'||name==='Agrupacions'||name==='Fagotades');
  var pd = name==='Documents' ? r : (name==='Obres' && r['ID'] ? firstDoc('Obra', r['ID']) : null);
  var pid = pd ? fileId(docUrl(pd)) : '';
  if (pid) body = '<details class="edprev" open><summary>Portada del PDF</summary>' +
    viewerHtml(pid, pd) +
    (pd['T\u00edtol'] ? '<div class="hint" style="margin-top:6px">Nom del fitxer: '+esc(pd['T\u00edtol'])+'</div>' : '') + '</details>' + body;
  if (opts.review) body = '<div class="hint" style="margin-bottom:8px">Revisi\u00f3: en queden <b>'+opts.review+'</b>. Omple el que falti i toca \u00abDesa i seg\u00fcent\u00bb.' +
    ((r['Notes']||'').indexOf('Carpeta:') === 0 ? '<br>' + esc((r['Notes'].match(/Carpeta: ([^\u00b7]*)/)||[,''])[1]) : '') + '</div>' + body;
  openPanel(opts.review ? 'Revisi\u00f3' : isNew ? (fem?'Nova ':'Nou ') + SINGULAR[name] : 'Edita', body, back);
  if (pd) fillPreviews(pd);
  if ($('rvskip')) $('rvskip').onclick = function(){ S.revSkip[r['ID']] = 1; reviewNext(); };
  bindChips($('panel'));
  FPICK = $('ffiles') ? filePicker('faddf', 'ffiles', 'fflist', 'fdrop') : null;
  $('sv').onclick = function(){
    var o = {};
    if (!isNew) { o[KEYS[name]] = r[KEYS[name]]; o.__orig = r[KEYS[name]]; }
    Array.prototype.forEach.call($('panel').querySelectorAll('[data-k]'), function(el){
      o[el.dataset.k] = el.classList.contains('chips') ? (el.dataset.val||'') :
        el.type==='checkbox' ? (el.checked?'Sí':'') : String(el.value||'').trim();
    });
    var tipus = o['__tipus']; delete o['__tipus'];
    var files = $('ffiles') ? (FPICK || []).slice() : [];
    if (name==='Concerts' && !o['Data']) { toast('Posa la data del concert perqu\u00e8 surti a Inici'); return; }
    if (name==='Obres' && !o['Obra'] && !o['Compositor']) { toast('Posa almenys el títol de l\'obra o el compositor'); return; }
    if (name==='Documents') o['Revisat'] = 'S\u00ed';
    // Edici\u00f3 d'un registre existent sense fitxers: es desa en segon pla i es continua de seguida
    if (!isNew && !files.length) {
      var payload = JSON.parse(JSON.stringify(o));
      Object.keys(o).forEach(function(k){ if (k.indexOf('__') !== 0) r[k] = o[k]; });
      addLocalLabels(name, o);
      bgSave(name, payload, r);
      if (opts.review) { S.revSkip[r['ID']] = 1; reviewNext(); } else showDetail(name, r[KEYS[name]]);
      return;
    }
    $('sv').disabled = true; $('sv').textContent = 'Desant...';
    run('saveRow', name, o).then(function(newId){
      var meta = { 'Tipus': tipus || '' }; meta[name==='Concerts' ? 'Concert' : 'Obra'] = newId;
      return (files.length ? uploadFiles(files, meta, $('fprog')) : Promise.resolve())
        .then(function(){ return load(); })
        .then(function(){ toast(files.length ? 'Desat amb '+files.length+(files.length>1?' fitxers':' fitxer') : 'Desat'); if (opts.review) { S.revSkip[r['ID']] = 1; reviewNext(); } else showDetail(name, newId); });
    })
      .catch(function(e){ $('sv').disabled=false; $('sv').textContent='Desa'; toast('Error: '+e.message); });
  };
  if ($('del')) $('del').onclick = function(){
    if (name==='Documents') { delDoc(r); return; }
    if (!confirm('Eliminar aquest registre?')) return;
    run('deleteRow', name, r[KEYS[name]]).then(load).then(function(){ toast('Eliminat'); closePanel(); })
      .catch(function(e){ toast('Error: '+e.message); });
  };
}

/* Desat en segon pla (cua): l'app no espera el servidor per passar al seg\u00fcent */
var SAVEQ = Promise.resolve(), SAVEN = 0;
function bgSave(name, o, r){
  SAVEN++; saveBadge();
  SAVEQ = SAVEQ.then(function(){ return run('saveRow', name, o); })
    .then(function(){ SAVEN--; saveBadge(); },
      function(e){ SAVEN--; saveBadge(); toast('No s\'ha pogut desar \u00ab' + (r['T\u00edtol'] || r['Obra'] || r[KEYS[name]]) + '\u00bb: ' + (e.message || e) + '. Torna-ho a provar.'); });
}
function saveBadge(){
  var b = $('savebadge');
  if (!b) { b = document.createElement('div'); b.id = 'savebadge'; b.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:60;background:var(--ink);color:var(--paper);font-size:12px;padding:5px 10px;border-radius:12px;opacity:.85;pointer-events:none'; document.body.appendChild(b); }
  b.textContent = SAVEN > 0 ? 'Desant ' + SAVEN + '...' : '';
  b.style.display = SAVEN > 0 ? 'block' : 'none';
}
window.addEventListener('beforeunload', function(e){ if (SAVEN > 0) { e.preventDefault(); e.returnValue = ''; } });
function addLocalLabels(name, o){
  (SCHEMA[name] || []).forEach(function(f){
    if (!f[2] || String(f[2]).indexOf('L:') !== 0 || !o[f[0]]) return;
    var ln = f[2].slice(2), list = D.Llistes[ln] = D.Llistes[ln] || [];
    String(o[f[0]]).split(/\s*,\s*/).filter(String).forEach(function(v){ if (list.indexOf(v) === -1) list.push(v); });
  });
}

/* Llista de fitxers que es va omplint: es poden afegir fitxers de diverses carpetes o arrossegant-los */
var FPICK = null;
function filePicker(btnId, inputId, listId, dropId, onChange){
  var picked = [];
  function draw(){
    $(listId).innerHTML = picked.map(function(f, i){
      return '<div class="lrow" style="cursor:default"><div class="body"><div class="t">'+esc(f.name)+'</div><div class="s">'+(f.size/1048576).toFixed(1)+' MB</div></div>' +
        '<button class="btn" type="button" data-rm="'+i+'" style="padding:3px 9px;font-size:12px">Treu</button></div>'; }).join('');
    Array.prototype.forEach.call($(listId).querySelectorAll('[data-rm]'), function(b){ b.onclick = function(){ picked.splice(+b.dataset.rm, 1); draw(); }; });
    if (onChange) onChange(picked);
  }
  function add(list){
    Array.prototype.forEach.call(list, function(f){ if (!picked.some(function(x){ return x.name === f.name && x.size === f.size; })) picked.push(f); });
    draw();
  }
  $(btnId).onclick = function(){ $(inputId).click(); };
  $(inputId).onchange = function(){ add(this.files); this.value = ''; };
  var dz = $(dropId);
  dz.ondragover = function(e){ e.preventDefault(); dz.classList.add('on'); };
  dz.ondragleave = function(){ dz.classList.remove('on'); };
  dz.ondrop = function(e){ e.preventDefault(); dz.classList.remove('on'); if (e.dataTransfer && e.dataTransfer.files) add(e.dataTransfer.files); };
  return picked;
}

/* ---------- Compartir ---------- */
function showShare(d, box){
  var id = fileId(docUrl(d)); if (!id) { toast('Aquest document no té fitxer'); return; }
  box.innerHTML = '<div class="share"><div class="hint">Preparant...</div></div>';
  var prepared = null;
  run('getShareInfo', id).then(function(info){
    var title = d['Títol'] || info.name;
    var linkHtml = function(url){
      var txt = title + ' – ' + url;
      return '<div class="srow">' +
        '<a class="btn" target="_blank" href="https://wa.me/?text='+encodeURIComponent(txt)+'">WhatsApp</a>' +
        '<a class="btn" target="_blank" href="https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(title)+'">Telegram</a>' +
        '<a class="btn" target="_blank" href="mailto:?subject='+encodeURIComponent(title)+'&body='+encodeURIComponent(txt)+'">Correu</a>' +
        '<button class="btn" id="cplink">Copia l\'enllaç</button></div>';
    };
    var canFile = !!(navigator.share && navigator.canShare) && info.size <= 20*1024*1024;
    var h = '<div class="share"><h3>Comparteix</h3>';
    if (canFile) h += '<div class="hint">Envia el PDF directament (WhatsApp, Telegram, Correu, AirDrop...):</div>' +
      '<div class="srow"><button class="btn p" id="shfile" disabled>Preparant el fitxer...</button></div>';
    h += '<div class="hint" style="margin-top:12px">O envia un enllaç per obrir-lo:</div>';
    if (info.isPublic) h += linkHtml(info.url);
    else if (info.canLink) h += '<div class="srow"><button class="btn" id="mkpub">Activa l\'enllaç per compartir</button></div>' +
      '<div class="hint">Qualsevol persona amb l\'enllaç podrà veure aquest fitxer (no editar-lo).</div>';
    else h += '<div class="hint">Aquest fitxer és d\'una altra persona: només el pots enviar com a fitxer.</div>';
    h += '<div class="srow" style="margin-top:12px"><a class="btn" target="_blank" href="https://drive.google.com/uc?export=download&id='+id+'">Descarrega</a></div>';
    if (d['Anotacions']) h += '<div class="hint" style="margin-top:14px">Aquesta partitura t\u00e9 anotacions teves. L\'enll\u00e7 i la desc\u00e0rrega s\u00f3n sempre sense anotacions.</div>' +
      (canFile ? '<label class="chk" style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:6px"><input type="checkbox" id="shann" style="width:20px;height:20px"> Envia el PDF amb les meves anotacions</label>' : '') +
      '<div class="srow"><button class="btn" id="shannlink">Fes una c\u00f2pia amb anotacions i comparteix-la</button></div><div id="shannlinks"></div>';
    h += '</div>';
    box.innerHTML = h;
    var annFile = null;
    if ($('shannlink')) $('shannlink').onclick = function(){
      var bb = this; bb.disabled = true; bb.textContent = 'Preparant...';
      run('getPdfForEdit', id).then(function(fd){ return annotatedBytes(d, b64ToBytes(fd.data)); })
        .then(function(by){ return run('savePackage', bytesToB64(by), (title + ' (anotat).pdf')); })
        .then(function(r){ return run('makePublicLink', r.id); })
        .then(function(link){ bb.textContent = 'C\u00f2pia desada a Arxiu de Repertori / Paquets'; $('shannlinks').innerHTML = shareLinks(title + ' (anotat)', link); })
        .catch(function(e){ bb.disabled = false; bb.textContent = 'Fes una c\u00f2pia amb anotacions i comparteix-la'; toast('Error: ' + e.message); });
    };
    var bindLinks = function(url){
      if ($('cplink')) $('cplink').onclick = function(){
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function(){ toast('Enllaç copiat'); })
          .catch(function(){ prompt('Copia l\'enllaç:', url); });
      };
    };
    bindLinks(info.url);
    if ($('mkpub')) $('mkpub').onclick = function(){
      $('mkpub').disabled = true; $('mkpub').textContent = 'Activant...';
      run('makePublicLink', id).then(function(url){
        var row = $('mkpub').parentNode; var hint = row.nextSibling;
        if (hint && hint.classList && hint.classList.contains('hint')) hint.remove();
        var tmp = document.createElement('div'); tmp.innerHTML = linkHtml(url); row.replaceWith(tmp.firstChild); bindLinks(url);
      }).catch(function(e){ toast('Error: '+e.message); $('mkpub').disabled = false; });
    };
    if (canFile) {
      run('getFileData', id).then(function(fd){
        var bin = atob(fd.data), arr = new Uint8Array(bin.length);
        for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
        var name = /\.[a-z0-9]{2,5}$/i.test(fd.name) ? fd.name : fd.name + '.pdf';
        prepared = new File([arr], name, { type: fd.mime });
        var b = $('shfile'); if (!b) return;
        if (!navigator.canShare({ files: [prepared] })) { b.textContent = 'El navegador no permet enviar fitxers'; return; }
        b.disabled = false; b.textContent = 'Envia el PDF';
        if ($('shann')) $('shann').onchange = function(){
          if (!this.checked || annFile) return;
          b.disabled = true; b.textContent = 'Afegint anotacions...';
          annotatedBytes(d, arr).then(function(by){ annFile = new File([by], name.replace(/\.pdf$/i, '') + ' (anotat).pdf', { type: 'application/pdf' }); b.disabled = false; b.textContent = 'Envia el PDF'; })
            .catch(function(e){ b.disabled = false; b.textContent = 'Envia el PDF'; toast('Error: ' + e.message); });
        };
        b.onclick = function(){
          var f = ($('shann') && $('shann').checked && annFile) ? annFile : prepared;
          navigator.share({ files: [f], title: title }).catch(function(e){
            if (e && e.name !== 'AbortError') toast('No s\'ha pogut obrir el menú de compartir: fes servir l\'enllaç');
          });
        };
      }).catch(function(e){ var b = $('shfile'); if (b) b.textContent = e.message || 'No s\'ha pogut preparar'; });
    }
  }).catch(function(e){ box.innerHTML = '<div class="hint">Error: '+esc(e.message)+'</div>'; });
}

    if (!draw.on || (penSeen && e.pointerType === 'touch')) return;
    var q = pt(e);
    if (draw.erase) { if (e.buttons) ann(cur.i).then(function(a){ eraseAt(strokesOf(a), q); }); return; }
    var s = draw.stroke; if (!s) return;
    var n = s.p.length, lx = s.p[n-2], ly = s.p[n-1];
    if (Math.abs(q[0]-lx) + Math.abs(q[1]-ly) < 0.0015) return;
    s.p.push(+q[0].toFixed(4), +q[1].toFixed(4));
    var ctx = o.getContext('2d'); drawStroke(ctx, { c: s.c, w: s.w, p: [lx, ly, q[0], q[1]] }, o.width, o.height);
  });
  function endStroke(){ draw.stroke = null; }
  o.addEventListener('pointerup', endStroke); o.addEventListener('pointercancel', endStroke);
  function eraseAt(list, q){
    var before = list.length, r = 0.015;
    for (var k = list.length - 1; k >= 0; k--) {
      var p = list[k].p;
      for (var j = 0; j < p.length; j += 2) if (Math.abs(p[j]-q[0]) < r && Math.abs(p[j+1]-q[1]) < r) { list.splice(k, 1); break; }
    }
    if (list.length !== before) { draw.dirty[docs[cur.i]['ID']] = true; paintAnn(); }
  }
  Array.prototype.forEach.call(st.querySelectorAll('[data-col]'), function(b){
    b.onclick = function(){ draw.col = b.dataset.col; draw.erase = false; $('sterase').classList.remove('on');
      Array.prototype.forEach.call(st.querySelectorAll('[data-col]'), function(x){ x.classList.toggle('on', x === b); }); };
  });
  $('stthin').onclick = function(){ draw.w = draw.w < 0.003 ? 0.006 : 0.0025; this.textContent = draw.w < 0.003 ? 'Fi' : 'Gruixut'; };
  $('sterase').onclick = function(){ draw.erase = !draw.erase; this.classList.toggle('on', draw.erase); };
  $('stundo').onclick = function(){ ann(cur.i).then(function(a){ var l = strokesOf(a); if (l.length) { l.pop(); draw.dirty[docs[cur.i]['ID']] = true; paintAnn(); } }); };
  $('stclr').onclick = function(){ if (!confirm('Esborrar totes les anotacions d\'aquesta pàgina?')) return;
    ann(cur.i).then(function(a){ a.pages[cur.p] = []; draw.dirty[docs[cur.i]['ID']] = true; paintAnn(); }); };
  $('stdone').onclick = function(){ setDraw(false); };
  $('stpen').onclick = function(e){ e.stopPropagation(); setDraw(!draw.on); };
  $('steye').onclick = function(e){ e.stopPropagation(); showAnn = !showAnn; this.textContent = 'Anot.: ' + (showAnn ? 'Sí' : 'No'); paintAnn(); };
  $('stx').onclick = close;
  $('stsel').onchange = function(){ saveAnn(cur.i); cur.i = +this.value; cur.p = 1; show(); };
  st.classList.add('bar'); setTimeout(function(){ if (!draw.on) st.classList.remove('bar'); }, 2500);
  if (opts.draw) { draw.on = true; st.classList.add('drawing'); }
  show();
}

/* ---------- Anotacions dins del PDF (per enviar) ---------- */
function hexRgb(h){ var n = parseInt(h.slice(1), 16); return window.PDFLib.rgb(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255); }
// Retorna un PDF nou amb les anotacions dibuixades a sobre (l'original no es toca)
function burnAnnotations(bytes, a){
  var L;
  return pdfLibs().then(function(){ L = window.PDFLib; return Promise.all([L.PDFDocument.load(bytes, { ignoreEncryption: true }), window.pdfjsLib.getDocument({ data: bytes.slice() }).promise]); })
  .then(function(r){
    var doc = r[0], js = r[1], pages = doc.getPages(), chain = Promise.resolve();
    Object.keys(a.pages || {}).forEach(function(k){
      var n = +k; if (!pages[n-1] || !a.pages[k].length) return;
      chain = chain.then(function(){ return js.getPage(n); }).then(function(pg){
        var vp = pg.getViewport({ scale: 1 }), page = pages[n-1];
        a.pages[k].forEach(function(s){
          var col = hexRgb(s.c), th = Math.max(0.5, s.w * vp.width), p = s.p;
          var P = function(j){ var q = vp.convertToPdfPoint(p[j] * vp.width, p[j+1] * vp.height); return { x: q[0], y: q[1] }; };
          if (p.length === 2) { var a0 = P(0); page.drawCircle({ x: a0.x, y: a0.y, size: th / 2, color: col }); return; }
          for (var j = 2; j < p.length; j += 2) page.drawLine({ start: P(j-2), end: P(j), thickness: th, color: col, lineCap: L.LineCapStyle.Round });
        });
      });
    });
    return chain.then(function(){ return doc.save(); });
  });
}
function annotatedBytes(d, bytes){
  if (!d['Anotacions']) return Promise.resolve(bytes);
  return run('getAnnotations', d['ID']).then(function(s){
    var a = null; try { a = s ? JSON.parse(s) : null; } catch (e) {}
    return a && a.pages && Object.keys(a.pages).length ? burnAnnotations(bytes, a) : bytes;
  });
}

/* ---------- Paquet en un sol PDF ---------- */
function shareLinks(title, url){
  var txt = title + ' \u2013 ' + url;
  return '<div class="srow">' +
    '<a class="btn" target="_blank" href="https://wa.me/?text='+encodeURIComponent(txt)+'">WhatsApp</a>' +
    '<a class="btn" target="_blank" href="https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(title)+'">Telegram</a>' +
    '<a class="btn" target="_blank" href="mailto:?subject='+encodeURIComponent(title)+'&body='+encodeURIComponent(txt)+'">Correu</a></div>';
}
/* Ordre de guió de director: general, vent fusta, vent metall, percussió, teclats/arpa, veus, corda */
var SCORE_ORDER = [
  [/partitura general|full score|\bscore\b|\bguio\b|\bdirector\b|conductor|\bgeneral\b|partitur\b|\bdirettore\b/, 0],
  [/piccolo|flauti|ottavino/, 10], [/alto flute|flauta en sol|flauta alt/, 12], [/flaut|flute|flote|\bfl\b/, 11],
  [/english horn|cor angl|corno ingl|corn angl|cor anglais|englischhorn/, 22], [/oboe|oboi|hautbois|\bob\b/, 20],
  [/requint|clarinet(e|o)? (in |en )?(eb|mib)|eb clarinet/, 29], [/bass clarinet|clarinet(e|o)? baix|clarinete bajo|clarone|bassklarinet/, 32],
  [/clarin|klarinet|\bcl\b/, 30],
  [/soprano sax|saxo(fon|phone)? soprano|sax soprano/, 34], [/alto sax|saxo(fon|phone)? alt|sax alt/, 35], [/tenor sax|saxo(fon|phone)? tenor|sax tenor/, 36],
  [/baritone sax|saxo(fon|phone)? bariton|sax bariton/, 37], [/saxo|\bsax\b/, 35],
  [/contrafag|contrabassoon|kontrafag|contrabasson|controfag/, 42], [/fagot|bassoon|basson|\bfg\b|\bbsn\b/, 40],
  [/\bhorn|trompa|corno|\bhrn\b|waldhorn/, 50], [/trumpet|trompet|tromba|cornet|fliscorn|flugel|\btpt\b/, 55],
  [/bass trombone|trombo baix|trombon bajo/, 62], [/trombo|posaune|\btbn\b/, 60], [/euphonium|bombard|baritone|tenor tuba/, 64], [/tuba|\btb\b/, 66],
  [/timpan|timbal|pauken/, 70], [/percus|bateria|drum|caixa|bombo|plats|cymbal|glock|xilo|xylo|marimba|vibraf|vibraph|lamines|claves|triangle/, 72],
  [/arpa|harp|harpe/, 80], [/celest/, 81], [/piano|pno|klavier|teclat|keyboard|organ|orgue/, 82], [/guitar|guitarra/, 83],
  [/soprano|\bsop\b/, 85], [/contralt|mezzo/, 86], [/\btenor\b/, 87], [/baritono|\bbaix\b voz|\bbass voice/, 88], [/\bcor\b mixt|choir|coral/, 89],
  [/violin|violi\b|violino|\bvln?\b|geige/, 90], [/viola\b|\bvla\b|\balto\b/, 92], [/cello|violoncel|\bvc\b/, 93],
  [/contrabai|double bass|contrabass|kontrabass|contrabajo|\bcb\b|\bbass\b/, 94]
];
function scoreRank(d){
  var tip = String(d['Tipus']||''), t = ' ' + norm(String(d['T\u00edtol']||'').replace(/^\s*\d{1,3}[a-z]?[\s._-]+/i, '').replace(/[_\-.()]+/g, ' ')) + ' ';
  var ins = ' ' + norm(d['Instrument']||'') + ' ';
  var r = 99;
  if (/partitura general/i.test(tip) && !/particel/i.test(tip)) r = 0;
  else for (var i = 0; i < SCORE_ORDER.length; i++) if (SCORE_ORDER[i][0].test(t) || SCORE_ORDER[i][0].test(ins)) { r = SCORE_ORDER[i][1]; break; }
  var m = /(?:^|\s)([1-4])(?:st|nd|rd|th|r|n|o|t)?(?=\s)|(?:^|\s)(iv|iii|ii)(?=\s)/.exec(t + ins);
  var k = m ? (m[1] ? +m[1] : { ii: 2, iii: 3, iv: 4 }[m[2]]) : 0;
  return r * 10 + k;
}
function sortScore(docs){
  return docs.map(function(d, i){ return { d: d, r: scoreRank(d), i: i }; })
    .sort(function(a, b){ return a.r - b.r || norm(a.d['T\u00edtol']).localeCompare(norm(b.d['T\u00edtol'])); })
    .map(function(x){ return x.d; });
}
function showPackage(docs, title, back, opts){
  opts = opts || {};
  docs = pdfOnly(docs);
  if (!docs.length) { toast('No hi ha cap PDF per ajuntar'); return; }
  if (opts.score) docs = sortScore(docs);
  openPanel(opts.offline ? 'Sense connexi\u00f3' : 'PDF \u00fanic', (opts.offline ?
    '<div class="share" style="margin-top:0"><b>Per tenir el programa sense connexi\u00f3</b><div class="hint" style="margin-top:4px">1. Toca \u00abCrea el PDF\u00bb. 2. Toca \u00abEnvia el PDF\u00bb i tria <b>Desa a Fitxers</b> &gt; <b>Al meu iPad</b> (o obre\'l amb l\'app <b>Llibres</b>). Aix\u00ed el tindr\u00e0s a l\'iPad encara que no hi hagi cobertura, amb les teves anotacions.</div></div>'
    : '<div class="hint">' + (opts.score ? 'Ordenat com un gui\u00f3 de director: primer la partitura general i despr\u00e9s les particel\u00b7les (vent fusta, vent metall, percussi\u00f3, corda). Pots canviar l\'ordre amb les fletxes o treure\'n alguna.' : 'Tria les partitures i l\'ordre. Es crear\u00e0 un sol PDF per enviar als alumnes o companys.') + '</div>' +
      (docs.length > 1 ? '<div class="row" style="margin-top:8px"><button class="btn" id="pksort">Ordena com un gui\u00f3 de director</button></div>' : '')) +
    '<label>Nom del PDF</label><input id="pkname" value="'+esc(title)+'" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit">' +
    (docs.some(function(d){ return d['Anotacions']; }) ? '<label class="chk" style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:12px"><input type="checkbox" id="pkann" style="width:20px;height:20px"'+(opts.offline?' checked':'')+'> Amb les meves anotacions</label>' : '') +
    '<div class="lst" id="pklist" style="margin-top:12px"></div>' +
    '<div class="row"><button class="btn p" id="pkgo">Crea el PDF</button></div><div id="pkmsg" class="hint"></div><div id="pkout"></div>', back);
  var sel = docs.map(function(){ return true; });
  function draw(){
    $('pklist').innerHTML = docs.map(function(d, i){
      return '<div class="lrow" style="cursor:default"><input type="checkbox" data-i="'+i+'"'+(sel[i]?' checked':'')+' style="width:20px;height:20px">' + cover(d, ' ') +
        '<div class="body"><div class="t">'+esc(d['T\u00edtol'])+'</div><div class="s">'+esc([d['Tipus'], d['Anotacions'] ? 'amb anotacions' : ''].filter(Boolean).join(' \u00b7 '))+'</div></div>' +
        '<button class="btn" data-up="'+i+'" style="padding:4px 9px">\u2191</button><button class="btn" data-dn="'+i+'" style="padding:4px 9px">\u2193</button></div>';
    }).join('');
    Array.prototype.forEach.call($('pklist').querySelectorAll('[data-i]'), function(c){ c.onchange = function(){ sel[+c.dataset.i] = c.checked; }; });
    function sw(a, b){ if (b < 0 || b >= docs.length) return; var t = docs[a]; docs[a] = docs[b]; docs[b] = t; t = sel[a]; sel[a] = sel[b]; sel[b] = t; draw(); }
    Array.prototype.forEach.call($('pklist').querySelectorAll('[data-up]'), function(b){ b.onclick = function(){ sw(+b.dataset.up, +b.dataset.up - 1); }; });
    Array.prototype.forEach.call($('pklist').querySelectorAll('[data-dn]'), function(b){ b.onclick = function(){ sw(+b.dataset.dn, +b.dataset.dn + 1); }; });
  }
  draw();
  if ($('pksort')) $('pksort').onclick = function(){
    var on = docs.map(function(d, i){ return sel[i] ? d : null; });
    docs = sortScore(docs); sel = docs.map(function(d){ return on.indexOf(d) > -1; }); draw(); toast('Ordenat com un gui\u00f3');
  };
  $('pkgo').onclick = function(){
    var list = docs.filter(function(d, i){ return sel[i]; });
    if (!list.length) { toast('Tria almenys una partitura'); return; }
    var name = ($('pkname').value || title).trim(), b = $('pkgo'); b.disabled = true;
    var L, out, n = 0;
    pdfLibs().then(function(){ L = window.PDFLib; return L.PDFDocument.create(); }).then(function(o){
      out = o; var chain = Promise.resolve();
      list.forEach(function(d){
        chain = chain.then(function(){ n++; $('pkmsg').textContent = 'Afegint ' + n + ' de ' + list.length + ': ' + d['T\u00edtol'];
          return run('getPdfForEdit', fileId(docUrl(d))); })
          .then(function(fd){ var by = b64ToBytes(fd.data); return ($('pkann') && $('pkann').checked) ? annotatedBytes(d, by) : by; })
          .then(function(by){ return L.PDFDocument.load(by, { ignoreEncryption: true }); })
          .then(function(src){ return out.copyPages(src, src.getPageIndices()); })
          .then(function(pages){ pages.forEach(function(p){ out.addPage(p); }); })
          .catch(function(e){ toast('No s\'ha pogut afegir ' + d['T\u00edtol']); });
      });
      return chain;
    }).then(function(){ out.setTitle(name); return out.save(); }).then(function(bytes){
      b.disabled = false;
      var fname = name.replace(/[\\/:*?"<>|]+/g, '-') + '.pdf';
      var file = new File([bytes], fname, { type: 'application/pdf' });
      var url = URL.createObjectURL(file), mb = (bytes.length / 1048576).toFixed(1);
      $('pkmsg').textContent = 'Fet: ' + out.getPageCount() + ' p\u00e0gines \u00b7 ' + mb + ' MB';
      var canShare = navigator.canShare && navigator.canShare({ files: [file] });
      $('pkout').innerHTML = '<div class="share"><h3>Envia-ho</h3><div class="srow">' +
        (canShare ? '<button class="btn p" id="pkshare">Envia el PDF</button>' : '') +
        '<a class="btn" id="pkdl" href="'+url+'" download="'+esc(fname)+'">Descarrega</a>' +
        '<button class="btn" id="pkdrive">Desa al Drive i comparteix un enlla\u00e7</button></div><div id="pklinks"></div></div>';
      if ($('pkshare')) $('pkshare').onclick = function(){ navigator.share({ files: [file], title: name }).catch(function(e){ if (e && e.name !== 'AbortError') toast('No s\'ha pogut obrir el men\u00fa de compartir'); }); };
      $('pkdrive').onclick = function(){
        var bb = $('pkdrive'); bb.disabled = true; bb.textContent = 'Desant...';
        run('savePackage', bytesToB64(bytes), fname).then(function(r){ return run('makePublicLink', r.id); }).then(function(link){
          bb.textContent = 'Desat a Arxiu de Repertori / Paquets';
          $('pklinks').innerHTML = '<div class="hint" style="margin-top:8px">Qualsevol persona amb l\'enlla\u00e7 el podr\u00e0 veure i descarregar:</div>' + shareLinks(name, link);
        }).catch(function(e){ bb.disabled = false; bb.textContent = 'Desa al Drive i comparteix un enlla\u00e7'; toast('Error: ' + e.message); });
      };
    }).catch(function(e){ b.disabled = false; $('pkmsg').textContent = 'Error: ' + (e.message || e); });
  };
}
// Grups propis de cada centre (a m\u00e9s dels cursos d'Iniciaci\u00f3, Elemental i Professional)
var CENTRE_GROUPS = { 'Vila-seca': ['M\u00fasica de cambra'], "L'Hospitalet": ['EMMCA', 'Ministrils', "Toc d'inici"] };
function isGroup(c){ return Object.keys(CENTRE_GROUPS).some(function(k){ return CENTRE_GROUPS[k].indexOf(c) > -1; }); }
function centreGroups(){ return S.centre ? (CENTRE_GROUPS[S.centre] || []) : Object.keys(CENTRE_GROUPS).reduce(function(a, k){ return a.concat(CENTRE_GROUPS[k]); }, []); }
function inGroup(o, c){ return splitTags(o['Curs']).indexOf(c) > -1 || splitTags(o['Etiquetes']).indexOf(c) > -1; }
function inCentre(o){ return !S.centre || o['Centre']===S.centre || splitTags(o['Etiquetes']).indexOf(S.centre) > -1 ||
  (CENTRE_GROUPS[S.centre] || []).some(function(g){ return inGroup(o, g); }); }
function courseDocs(curs){
  var seen = {}, out = [];
  rows('Obres').filter(function(o){ return inGroup(o, curs) && inCentre(o); })
    .sort(function(a,b){ return norm(a['Obra']).localeCompare(norm(b['Obra'])); })
    .forEach(function(o){ docsFor('Obra', o['ID']).forEach(function(d){ if (!seen[d['ID']]) { seen[d['ID']] = 1; out.push(d); } }); });
  rows('Documents').filter(function(d){ return splitTags(d['Curs']).indexOf(curs) > -1; })
    .sort(function(a,b){ return norm(a['T\u00edtol']).localeCompare(norm(b['T\u00edtol'])); })
    .forEach(function(d){ if (!seen[d['ID']]) { seen[d['ID']] = 1; out.push(d); } });
  return out;
}
