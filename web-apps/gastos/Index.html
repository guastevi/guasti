<!DOCTYPE html>
<html lang="ca">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="apple-mobile-web-app-title" content="Finances">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f4f1; --card: #ffffff; --text: #1d1d1b; --muted: #77776f; --line: #e6e5df;
    --in: #3fa34d; --out: #e2442f; --save: #2f8fe0; --inv: #8e5bd6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1f1f1d; --text: #f2f1ec; --muted: #a3a29a; --line: #32322f; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 16px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 24px; margin: 0; font-weight: 750; letter-spacing: -.01em; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 650; }
  select { font: inherit; font-size: 15px; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
  main { padding: 0 16px calc(96px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .view { display: none; } .view.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .mini { font-size: 14px; color: var(--muted); margin: 0 2px 12px; }
  .mini b { color: var(--text); font-weight: 650; }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 4px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
  .seg button.on { color: #fff; border-color: transparent; }
  .amount { display: flex; align-items: baseline; gap: 6px; margin-top: 18px; border-bottom: 1px solid var(--line); }
  .amount input { flex: 1; min-width: 0; font: inherit; font-size: 44px; font-weight: 750; border: 0; padding: 0 0 6px;
    background: transparent; color: var(--text); outline: none; }
  .amount span { font-size: 30px; font-weight: 700; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chips:empty { display: none; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px;
    padding: 7px 13px; font: inherit; font-size: 15px; }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  input.txt { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); outline: none; -webkit-appearance: none; }
  input.txt:focus { border-color: var(--muted); }
  .btn { width: 100%; margin-top: 20px; padding: 16px; border: 0; border-radius: 14px; font: inherit;
    font-weight: 700; font-size: 17px; color: #fff; background: var(--out); }
  .btn:disabled { opacity: .5; }

  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .kpi small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .kpi b { display: block; font-size: 22px; font-weight: 750; margin-top: 2px; letter-spacing: -.01em; }
  .kpi em { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
  .donut { position: relative; height: 220px; margin-bottom: 12px; }
  .donut .centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .donut .centre small { color: var(--muted); font-size: 12px; }
  .donut .centre b { font-size: 20px; }
  .rank .row { margin-bottom: 11px; }
  .rank .top { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
  .rank .top > span:first-child { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rank .top > span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rank .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .rank .pct { color: var(--muted); font-size: 13px; margin-left: 4px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .chartbox { position: relative; height: 230px; }
  .empty { color: var(--muted); font-size: 15px; text-align: center; padding: 18px 0; }

  .day { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin: 14px 0 2px; }
  .day:first-child { margin-top: 0; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .info b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .info small { color: var(--muted); font-size: 13px; }
  .item .amt { font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .item .del { border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 6px; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--card); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
  nav button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: transparent; color: var(--muted);
    padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav button svg { width: 24px; height: 24px; }
  nav button.on { color: var(--text); }
  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: 15px; font-weight: 600;
    opacity: 0; transition: .25s; pointer-events: none; max-width: 90%; text-align: center; z-index: 9; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--out); color: #fff; }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<header>
  <h1>Finances</h1>
  <select id="mes" aria-label="Mes"></select>
</header>

<main>
  <div id="carregant" class="loading">Carregant...</div>

  <!-- AFEGIR -->
  <section id="v-afegir" class="view">
    <p class="mini" id="miniResum"></p>
    <form class="card" id="form" autocomplete="off">
      <div class="seg" id="tipus"></div>
      <div class="amount">
        <input id="import" inputmode="decimal" placeholder="0,00" aria-label="Import">
        <span>€</span>
      </div>
      <label for="cat">Categoria</label>
      <div class="chips" id="catChips"></div>
      <input class="txt" id="cat" list="catList" placeholder="Escriu o tria una categoria">
      <datalist id="catList"></datalist>
      <label for="conc">Concepte (opcional)</label>
      <div class="chips" id="concChips"></div>
      <input class="txt" id="conc" placeholder="Per exemple: Mercadona">
      <label for="data">Data</label>
      <input class="txt" id="data" type="date">
      <button class="btn" id="desar" type="submit">Desar</button>
    </form>
  </section>

  <!-- RESUM -->
  <section id="v-resum" class="view">
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <h2>En què gasto més</h2>
      <div id="catBloc"></div>
    </div>
    <div class="card">
      <h2>Conceptes amb més despesa</h2>
      <div id="concBloc"></div>
    </div>
    <div class="card">
      <h2>Últims 6 mesos</h2>
      <div class="chartbox"><canvas id="evol"></canvas></div>
    </div>
    <div class="card">
      <h2>Ingressos per font</h2>
      <div id="fontsBloc"></div>
    </div>
  </section>

  <!-- MOVIMENTS -->
  <section id="v-moviments" class="view">
    <div class="card" id="llista"></div>
  </section>
</main>

<nav>
  <button data-v="afegir" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    Afegir
  </button>
  <button data-v="resum">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Resum
  </button>
  <button data-v="moviments">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    Moviments
  </button>
</nav>
<div class="toast" id="toast"></div>

<script>
const K = '<?= k ?>';
const MESOS = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const COLOR_TIPUS = { 'Despesa': '#e2442f', 'Ingrés': '#3fa34d', 'Estalvi': '#2f8fe0', 'Inversió': '#8e5bd6' };
const TIPUS = ['Despesa', 'Ingrés', 'Estalvi', 'Inversió'];
const PALETA = ['#2f8fe0','#e2442f','#3fa34d','#f2b134','#8e5bd6','#ef7d3c','#20a4a4','#d6589a','#7a8a99','#a1c935','#b5651d','#5c6bc0'];

let D = null, tipus = 'Despesa', vista = 'afegir', primera = true;
const charts = {};
const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat('ca-ES', { style: 'currency', currency: 'EUR' }).format(n || 0);
const fmt0 = n => new Intl.NumberFormat('ca-ES', { maximumFractionDigits: 0 }).format(n || 0) + ' €';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nomMes = m => { const [y, mm] = m.split('-'); const n = MESOS[+mm - 1]; return n.charAt(0).toUpperCase() + n.slice(1) + ' ' + y; };
const nomDia = d => { const [, mm, dd] = d.split('-'); const n = MESOS[+mm - 1]; return (+dd) + (/^[aeiou]/.test(n) ? " d'" : ' de ') + n; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function crida(fn, ...args) {
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
}

function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = 'toast' + (err ? ' err' : ''), 2400);
}

async function carrega(mes) {
  try {
    D = await crida('dadesApp', K, mes || null);
    pinta();
  } catch (e) {
    $('carregant').textContent = 'No s\'han pogut carregar les dades.';
    toast(e.message || 'Error', true);
  }
}

/* ---------- Pintar ---------- */

function pinta() {
  $('carregant').style.display = 'none';
  $('mes').innerHTML = D.mesos.map(m => `<option value="${m}" ${m === D.mes ? 'selected' : ''}>${nomMes(m)}</option>`).join('');
  if (primera) { $('data').value = D.avui; primera = false; }
  const r = D.resum;
  $('miniResum').innerHTML = `${nomMes(D.mes)}: despeses <b>${fmt(r.despeses)}</b> · disponible <b>${fmt(r.disponible)}</b>`;
  pintaTipus();
  pintaResum();
  pintaMoviments();
  mostra(vista);
}

function pintaTipus() {
  $('tipus').innerHTML = TIPUS.map(t =>
    `<button type="button" data-t="${t}" class="${t === tipus ? 'on' : ''}" style="${t === tipus ? 'background:' + COLOR_TIPUS[t] : ''}">${t}</button>`
  ).join('');
  $('desar').style.background = COLOR_TIPUS[tipus];
  const cats = (D.categories[tipus] || []);
  $('catList').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');
  pintaChips();
}

function pintaChips() {
  const cats = (D.categories[tipus] || []).slice(0, 10);
  const actual = $('cat').value.trim().toLowerCase();
  $('catChips').innerHTML = cats.map(c =>
    `<button type="button" class="chip ${c.toLowerCase() === actual ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const nomCat = cats.find(c => c.toLowerCase() === actual) || $('cat').value.trim();
  const concs = (D.conceptes[nomCat] || []).slice(0, 8);
  const ca = $('conc').value.trim().toLowerCase();
  $('concChips').innerHTML = concs.map(c =>
    `<button type="button" class="chip ${c.toLowerCase() === ca ? 'on' : ''}" data-k="${esc(c)}">${esc(c)}</button>`).join('');
}

function pintaResum() {
  const r = D.resum;
  const estalviTot = r.estalvi + r.inversio;
  $('kpis').innerHTML = `
    <div class="kpi"><small>Ingressos</small><b style="color:var(--in)">${fmt(r.ingressos)}</b></div>
    <div class="kpi"><small>Despeses</small><b style="color:var(--out)">${fmt(r.despeses)}</b></div>
    <div class="kpi"><small>Estalvi i inversió</small><b style="color:var(--save)">${fmt(estalviTot)}</b>
      <em>${fmt0(r.estalvi)} estalvi · ${fmt0(r.inversio)} inversió</em></div>
    <div class="kpi"><small>Disponible</small><b style="color:${r.disponible < 0 ? 'var(--out)' : 'var(--text)'}">${fmt(r.disponible)}</b></div>`;

  // Donut per categories
  if (charts.donut) { charts.donut.destroy(); charts.donut = null; }
  if (!r.categories.length) {
    $('catBloc').innerHTML = '<div class="empty">Encara no hi ha despeses aquest mes.</div>';
  } else {
    $('catBloc').innerHTML = `<div class="donut"><canvas id="donut"></canvas>
      <div class="centre"><small>Total</small><b>${fmt0(r.despeses)}</b></div></div>
      <div class="rank">${rankHtml(r.categories, true)}</div>`;
    charts.donut = new Chart($('donut'), {
      type: 'doughnut',
      data: { labels: r.categories.map(c => c.nom),
        datasets: [{ data: r.categories.map(c => c.total), backgroundColor: r.categories.map((c, i) => PALETA[i % PALETA.length]),
          borderColor: css('--card'), borderWidth: 2 }] },
      options: { cutout: '66%', maintainAspectRatio: false, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => ' ' + c.label + ': ' + fmt(c.raw) } } } }
    });
  }

  $('concBloc').innerHTML = r.conceptes.length
    ? `<div class="rank">${rankHtml(r.conceptes, false)}</div>`
    : '<div class="empty">Sense dades.</div>';

  $('fontsBloc').innerHTML = r.fonts.length
    ? `<div class="rank">${r.fonts.map(f => `<div class="row"><div class="top"><span>${esc(f.nom)}</span><span>${fmt(f.total)}</span></div>
        <div class="bar"><i style="width:${f.pct}%;background:var(--in)"></i></div></div>`).join('')}</div>`
    : '<div class="empty">Encara no hi ha ingressos aquest mes.</div>';

  // Evolució
  if (charts.evol) charts.evol.destroy();
  Chart.defaults.color = css('--muted');
  Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  const ev = D.evolucio;
  charts.evol = new Chart($('evol'), {
    type: 'bar',
    data: { labels: ev.map(e => MESOS[+e.mes.slice(5) - 1].slice(0, 3)),
      datasets: [
        { label: 'Ingressos', data: ev.map(e => e.ingressos), backgroundColor: COLOR_TIPUS['Ingrés'], borderRadius: 5 },
        { label: 'Despeses', data: ev.map(e => e.despeses), backgroundColor: COLOR_TIPUS['Despesa'], borderRadius: 5 },
        { label: 'Estalvi i inversió', data: ev.map(e => e.estalvi), backgroundColor: COLOR_TIPUS['Estalvi'], borderRadius: 5 }
      ] },
    options: { maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } },
        tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmt(c.raw) } } },
      scales: { x: { grid: { display: false } },
        y: { grid: { color: css('--line') }, ticks: { callback: v => fmt0(v) } } } }
  });
}

function rankHtml(llista, ambColors) {
  const max = Math.max(...llista.map(x => x.total), 1);
  return llista.map((x, i) => {
    const col = ambColors ? PALETA[i % PALETA.length] : 'var(--out)';
    return `<div class="row"><div class="top">
      <span>${ambColors ? `<i class="dot" style="background:${col}"></i>` : ''}${esc(x.nom)}</span>
      <span>${fmt(x.total)}<span class="pct">${String(x.pct).replace('.', ',')} %</span></span></div>
      <div class="bar"><i style="width:${(x.total / max * 100).toFixed(1)}%;background:${col}"></i></div></div>`;
  }).join('');
}

function pintaMoviments() {
  if (!D.moviments.length) { $('llista').innerHTML = '<div class="empty">No hi ha moviments aquest mes.</div>'; return; }
  let html = '', dia = '';
  D.moviments.forEach(m => {
    if (m.data !== dia) { dia = m.data; html += `<div class="day">${nomDia(dia)}</div>`; }
    const signe = m.tipus === 'Ingrés' ? '+' : '−';
    const titol = m.concepte || m.categoria;
    const sub = m.concepte ? `${esc(m.categoria)} · ${m.tipus}` : m.tipus;
    html += `<div class="item"><div class="info"><b>${esc(titol)}</b><small>${sub}</small></div>
      <div class="amt" style="color:${COLOR_TIPUS[m.tipus]}">${signe}${fmt(m.import)}</div>
      <button class="del" data-id="${esc(m.id)}" aria-label="Esborrar">×</button></div>`;
  });
  $('llista').innerHTML = html;
}

function mostra(v) {
  vista = v;
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'resum') Object.values(charts).forEach(c => c && c.resize());
}

/* ---------- Esdeveniments ---------- */

document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) { mostra(b.dataset.v); window.scrollTo(0, 0); }
});
$('mes').addEventListener('change', e => carrega(e.target.value));
$('tipus').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tipus = b.dataset.t; $('cat').value = ''; $('conc').value = ''; pintaTipus();
});
$('catChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  $('cat').value = b.dataset.c; $('conc').value = ''; pintaChips();
});
$('concChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  $('conc').value = b.dataset.k; pintaChips();
});
$('cat').addEventListener('input', pintaChips);
$('conc').addEventListener('input', pintaChips);

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const imp = $('import').value.trim();
  const cat = $('cat').value.trim();
  if (!imp || !(parseFloat(imp.replace(/\./g, '').replace(',', '.')) > 0)) { toast('Escriu un import', true); $('import').focus(); return; }
  if (!cat) { toast('Tria una categoria', true); return; }
  $('desar').disabled = true; $('desar').textContent = 'Desant...';
  try {
    D = await crida('afegirDesDeApp', K,
      { tipus, import: imp, categoria: cat, concepte: $('conc').value.trim(), data: $('data').value }, D.mes);
    $('import').value = ''; $('cat').value = ''; $('conc').value = '';
    pinta();
    toast(D.missatge || 'Desat');
  } catch (err) {
    toast(err.message || 'No s\'ha pogut desar', true);
  } finally {
    $('desar').disabled = false; $('desar').textContent = 'Desar';
  }
});

$('llista').addEventListener('click', async e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (!confirm('Vols esborrar aquest moviment?')) return;
  try { D = await crida('esborrarDesDeApp', K, b.dataset.id, D.mes); pinta(); toast('Esborrat'); }
  catch (err) { toast(err.message || 'Error', true); }
});

carrega(null);
</script>
</body>
</html>
