name: Guasti
options:
  bundleIdPrefix: cat.guasti
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Guasti:
    type: application
    platform: iOS
    sources:
      - Guasti
    scheme: {}
    info:
      path: Guasti/Info.plist
      properties:
        CFBundleDisplayName: Guasti
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Per fer fotos de les peces de l'armari.
        NSFaceIDUsageDescription: Per mostrar les peces privades.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-BoldSmall.ttf
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cat.guasti.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
